# Mirrae for Shopify. Learn more: https://shopify.dev/docs/apps/tools/cli/configuration
#
# BEFORE `shopify app deploy`: replace every https://example.com below with the address the app is served from
# (a tunnel while developing, the real domain in production). See docs/shopify-dev-setup.md.

client_id = "62db0ffc96bb88cda0a9b3d7ed4904c3"
name = "Mirrae"
# The embedded admin page lives at /shopify
application_url = "https://example.com/shopify"
embedded = true

[build]
include_config_on_deploy = true

[access_scopes]
# None needed: the shop name and domain, billing and the app's own metafields work without any scope
scopes = ""

[auth]
# Unused: installation is managed by Shopify and the app swaps session tokens (no OAuth redirect)
redirect_urls = [ "https://example.com/api/auth/callback" ]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled", "app_purchases_one_time/update" ]
  uri = "https://example.com/api/shopify/webhooks"

  # Required of every App Store app. Mirrae keeps no shopper personal data (the photo is deleted after the front
  # view and events are anonymous), so the customer topics are only acknowledged; shop/redact erases the shop.
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "https://example.com/api/shopify/webhooks"
